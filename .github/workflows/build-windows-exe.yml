name: Build VECrop Desktop Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/build-windows-exe.yml"
      - "index.html"
      - "js/**"
      - "css/**"
      - "partials/**"
      - "docs/**"
      - "config/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "desktop/requirements-build.txt"

      - name: Install Windows build dependencies
        run: python -m pip install -r desktop/requirements-build.txt

      - name: Run experiment validator regression tests
        run: python -m unittest discover -s tests -v

      - name: Bundle offline-capable VECrop web resources
        run: python desktop/prepare_web.py

      - name: Smoke-test source bundle
        run: python desktop/launcher.py --smoke-test

      - name: Build VECrop-Desktop.exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name VECrop-Desktop --add-data "desktop/_bundle;web" --collect-all webview desktop/launcher.py

      - name: Smoke-test frozen exe
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/VECrop-Desktop.exe").Path
          if ((Get-Item $exe).Length -lt 1500000) { throw "EXE unexpectedly small" }
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Frozen EXE smoke test failed: $($p.ExitCode)" }

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: VECrop-Desktop-Windows-x64
          path: dist/VECrop-Desktop.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish Windows release for in-app update checks
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "desktop-r$env:GITHUB_RUN_NUMBER"
          $notes = "VECrop Desktop Windows x64. Source commit: $env:GITHUB_SHA. Includes bundled curriculum and experiment UI. Public scientific-content files can also be synchronized from within the app; Internet DOI tools require connectivity. Back up observations with Export JSON before major upgrades."
          gh release create $tag "dist/VECrop-Desktop.exe" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "VECrop Desktop #$env:GITHUB_RUN_NUMBER" --notes $notes --latest
