<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VECrop Intelligence</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #eef4f1;
      --panel: #ffffff;
      --panel-soft: #f5faf7;
      --text: #10251d;
      --muted: #60756d;
      --border: #dbe8e1;
      --accent: #0e7a4f;
      --accent-2: #1ca76b;
      --success: #eafaf2;
      --warning: #fff4d6;
      --shadow: 0 12px 34px rgba(11, 40, 28, 0.08);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font: 16px/1.7 Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    a { color: var(--accent); }
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .top {
      max-width: 1500px;
      margin: 0 auto;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }
    .brand .ve { color: var(--accent); }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 260px;
    }
    select, input, button, textarea {
      font: inherit;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-soft);
      color: var(--text);
      padding: 10px 12px;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 700;
    }
    .status {
      max-width: 1500px;
      margin: 0 auto;
      padding: 0 18px 10px;
      color: var(--muted);
      font-size: 0.86rem;
    }
    .stats {
      max-width: 1500px;
      margin: 18px auto 0;
      display: grid;
      grid-template-columns: repeat(4, minmax(180px, 1fr));
      gap: 12px;
      padding: 0 18px;
    }
    .stat {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      box-shadow: var(--shadow);
    }
    .stat b {
      display: block;
      font-size: 1.8rem;
      line-height: 1.2;
      margin-bottom: 5px;
    }
    .stat span {
      color: var(--muted);
      font-size: 0.88rem;
    }
    .layout {
      max-width: 1500px;
      margin: 18px auto 40px;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr) 330px;
      gap: 16px;
      padding: 0 18px 18px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }
    aside {
      padding: 16px;
      position: sticky;
      top: 98px;
      max-height: calc(100vh - 120px);
      overflow: auto;
    }
    #toc a {
      display: block;
      text-decoration: none;
      color: var(--muted);
      padding: 7px 8px;
      border-radius: 8px;
      margin: 3px 0;
      font-size: 0.9rem;
    }
    #toc a:hover {
      background: var(--success);
      color: var(--accent);
    }
    main {
      padding: 18px 18px 24px;
      min-height: 600px;
    }
    article {
      max-width: 980px;
      margin: 0 auto;
    }
    article h1, article h2, article h3 {
      scroll-margin-top: 110px;
      line-height: 1.25;
    }
    article h1 { font-size: 2.1rem; margin-top: 0; }
    article h2 { margin-top: 2em; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    article h3 { margin-top: 1.4em; }
    article p, article li { color: #1d2d27; }
    article code {
      background: var(--success);
      padding: 0.15em 0.35em;
      border-radius: 6px;
      font-size: 0.95em;
    }
    article pre {
      overflow: auto;
      background: #0f172a;
      color: #e5f7ee;
      padding: 14px 16px;
      border-radius: 12px;
    }
    article blockquote {
      border-left: 4px solid var(--accent);
      background: var(--success);
      padding: 10px 14px;
      margin: 1em 0;
      border-radius: 8px;
    }
    article table {
      width: 100%;
      border-collapse: collapse;
      margin: 1em 0;
      overflow: auto;
      display: block;
    }
    article th, article td {
      border: 1px solid var(--border);
      padding: 8px 10px;
      text-align: left;
    }
    article th { background: var(--panel-soft); }
    .smart {
      padding: 16px;
    }
    .smart h3 {
      margin: 0 0 10px;
      font-size: 1.1rem;
    }
    .smart label {
      display: block;
      margin-top: 12px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .smart select, .smart textarea, .smart input {
      width: 100%;
      margin-top: 6px;
    }
    .smart textarea { min-height: 90px; resize: vertical; }
    .chip, .badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--success);
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 700;
      margin: 5px 6px 0 0;
    }
    .search-wrap { position: relative; }
    .search-results {
      position: absolute;
      top: 52px; left: 0; right: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      max-height: 260px;
      overflow: auto;
      display: none;
      z-index: 60;
    }
    .search-results a {
      display: block;
      padding: 8px 10px;
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid var(--border);
    }
    .search-results a:hover { background: var(--panel-soft); }
    .card {
      background: var(--panel-soft);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-top: 14px;
    }
    .card strong { display: block; margin-bottom: 6px; }
    .muted { color: var(--muted); }
    @media (max-width: 1100px) {
      .layout { grid-template-columns: 240px minmax(0, 1fr); }
      .smart { grid-column: 1 / -1; }
    }
    @media (max-width: 820px) {
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .layout { display: block; }
      aside { position: relative; top: 0; max-height: none; margin-bottom: 12px; }
      main { padding-top: 10px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <div class="brand"><span class="ve">VE</span>Crop Intelligence</div>
      <div class="toolbar">
        <div class="search-wrap" style="flex:1; min-width: 200px;">
          <input id="search" type="text" placeholder="Tìm kiếm trong giáo trình..." />
          <div id="results" class="search-results"></div>
        </div>
        <select id="chapter">
          <option value="all">Tất cả chương</option>
          <option value="1">Chương 1</option>
          <option value="2">Chương 2</option>
          <option value="3">Chương 3</option>
          <option value="4">Chương 4</option>
        </select>
      </div>
    </div>
    <div class="status" id="status">Sẵn sàng tải dữ liệu.</div>
  </header>

  <section class="stats">
    <div class="stat"><b id="chaptersCount">4</b><span>Chương đang hoạt động</span></div>
    <div class="stat"><b id="cropCount">—</b><span>Hồ sơ cây từ Python</span></div>
    <div class="stat"><b id="topicCount">—</b><span>Chủ đề AI gợi ý</span></div>
    <div class="stat"><b id="modeStatus">Web</b><span>Trạng thái hệ thống</span></div>
  </section>

  <div class="layout">
    <aside class="panel">
      <strong>Mục lục động</strong>
      <nav id="toc"></nav>
    </aside>

    <main class="panel">
      <article id="content">
        <p>Đang tải nội dung giáo trình...</p>
      </article>
    </main>

    <section class="smart panel">
      <h3>AI hỗ trợ chuyên môn</h3>
      <label>Loại cây</label>
      <select id="cropSelect"></select>

      <label>Mục tiêu</label>
      <textarea id="objective" placeholder="Ví dụ: tăng năng suất, giảm bệnh, tối ưu dinh dưỡng..."></textarea>

      <button id="recommendBtn" style="width: 100%; margin-top: 12px;">Gợi ý phương án</button>

      <div id="recommendation" class="card">
        <div class="muted">Chưa có gợi ý. Hãy chọn loại cây và mục tiêu.</div>
      </div>

      <div class="card">
        <strong>Khuyến nghị nhanh</strong>
        <span class="chip">Dinh dưỡng</span>
        <span class="chip">Môi trường</span>
        <span class="chip">Cây trồng</span>
        <span class="chip">Quản lý</span>
      </div>
    </section>
  </div>

  <script>
    const FILES = {
      1: 'docs/01-chapter-1.md',
      2: 'docs/02-chapter-2.md',
      3: 'docs/03-chapter-3.md',
      4: 'docs/04-chapter-4.md'
    };

    const content = document.getElementById('content');
    const toc = document.getElementById('toc');
    const chapterSelect = document.getElementById('chapter');
    const searchInput = document.getElementById('search');
    const resultsBox = document.getElementById('results');
    const statusBox = document.getElementById('status');
    const cropSelect = document.getElementById('cropSelect');
    const objective = document.getElementById('objective');
    const recommendation = document.getElementById('recommendation');

    let KNOWLEDGE = null;
    const cache = {};

    function slugify(text) {
      return text.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
    }

    function escapeHtml(str = '') {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function buildToc() {
      toc.innerHTML = '';
      const headings = content.querySelectorAll('h1, h2, h3');
      headings.forEach((h, idx) => {
        const text = h.textContent.trim();
        if (!text) return;
        const id = h.id || slugify(text) || `sec-${idx}`;
        h.id = id;
        const a = document.createElement('a');
        a.href = '#' + id;
        a.textContent = text;
        a.style.paddingLeft = (h.tagName === 'H2' ? 14 : h.tagName === 'H3' ? 22 : 6) + 'px';
        toc.appendChild(a);
      });
    }

    function protectMath(md) {
      const blocks = [];
      md = md.replace(/\$\$([\s\S]*?)\$\$/g, (_, x) => {
        const i = blocks.length;
        blocks.push('\\[' + x.trim() + '\\]');
        return `@@MATHBLOCK${i}@@`;
      });
      md = md.replace(/\$([^$\n]+)\$/g, (_, x) => {
        const i = blocks.length;
        blocks.push('\\(' + x.trim() + '\\)');
        return `@@MATHBLOCK${i}@@`;
      });
      return { md, blocks };
    }

    function restoreMath(html, blocks) {
      return html.replace(/@@MATHBLOCK(\d+)@@/g, (_, i) => '<div class="math-block">' + blocks[Number(i)] + '</div>');
    }

    async function getDoc(id) {
      if (cache[id]) return cache[id];
      const url = FILES[id] + '?v=' + Date.now();
      const r = await fetch(url, { cache: 'no-store' });
      if (!r.ok) throw new Error('Không tải được tài liệu ' + FILES[id]);
      const text = await r.text();
      cache[id] = text;
      return text;
    }

    async function render() {
      statusBox.textContent = 'Đang tải nội dung...';
      content.innerHTML = '<p>Đang tải giáo trình...</p>';
      try {
        const ids = chapterSelect.value === 'all' ? ['1', '2', '3', '4'] : [chapterSelect.value];
        let merged = ['# VECrop Intelligence', '', '---', ''];
        for (const id of ids) {
          const raw = await getDoc(id);
          merged.push(raw.replace(/^#\s*.*$/m, ''));
          merged.push('');
          merged.push('---');
          merged.push('');
        }
        const text = merged.join('\n');
        const { md, blocks } = protectMath(text);
        const html = marked.parse(md);
        content.innerHTML = restoreMath(html, blocks);
        buildToc();
        statusBox.textContent = `Đã tải: ${ids.length} chương`;
      } catch (err) {
        content.innerHTML = '<p>Không thể tải nội dung. Vui lòng kiểm tra lại dữ liệu.</p>';
        statusBox.textContent = 'Lỗi tải dữ liệu';
        console.error(err);
      }
    }

    async function loadKnowledge() {
      try {
        const r = await fetch('docs/data/vecrop_intelligence.json?v=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) throw new Error('Knowledge file missing');
        KNOWLEDGE = await r.json();
        const cropMap = KNOWLEDGE?.crops || {};
        cropSelect.innerHTML = Object.entries(cropMap).map(([key, crop]) => {
          return `<option value="${key}">${crop.name || key}</option>`;
        }).join('');
        document.getElementById('cropCount').textContent = String(Object.keys(cropMap).length || 0);
        document.getElementById('topicCount').textContent = String((KNOWLEDGE?.topics || []).length || 0);
      } catch (err) {
        console.warn('Không thể tải dữ liệu tri thức:', err);
        document.getElementById('cropCount').textContent = '0';
        document.getElementById('topicCount').textContent = '0';
      }
    }

    function recommend() {
      if (!KNOWLEDGE) {
        recommendation.innerHTML = '<div class="muted">Dữ liệu tri thức chưa được tải. Hãy thử lại.</div>';
        return;
      }
      const cropId = cropSelect.value;
      const crop = KNOWLEDGE.crops?.[cropId] || {};
      const goal = objective.value.trim().toLowerCase();
      const extra = [];

      if (!goal) {
        recommendation.innerHTML = '<div class="muted">Vui lòng nhập mục tiêu để nhận gợi ý.</div>';
        return;
      }

      if (/(dinh dưỡng|nitơ|phospho|kali|chất dinh dưỡng)/.test(goal)) {
        extra.push('Cân bằng dinh dưỡng theo giai đoạn phát triển của cây, ưu tiên bổ sung N-P-K đúng tỷ lệ.');
      }
      if (/(môi trường|nước|đất|ánh sáng|độ ẩm)/.test(goal)) {
        extra.push('Kiểm soát môi trường bằng hệ thống tưới hợp lý, ánh sáng cân bằng và độ ẩm ổn định.');
      }
      if (/(bệnh|kháng|bảo vệ)/.test(goal)) {
        extra.push('Thực hiện biện pháp phòng ngừa bệnh, giám sát thường xuyên và kiểm soát sâu bệnh sớm.');
      }

      const base = crop?.recommendation || 'Duy trì môi trường ổn định, theo dõi tình trạng cây và tối ưu dinh dưỡng theo giai đoạn tăng trưởng.';
      recommendation.innerHTML = `
        <strong>${crop?.name || 'Loại cây'}</strong>
        <div>${base}</div>
        <div style="margin-top:10px;">${extra.length ? '<strong>Gợi ý bổ sung:</strong><br>' + extra.map(x => '- ' + x).join('<br>') : ''}</div>
      `;
    }

    function smartSearch(q) {
      const val = q.trim().toLowerCase();
      resultsBox.innerHTML = '';
      if (val.length < 2) {
        resultsBox.style.display = 'none';
        return;
      }
      const nodes = [...document.querySelectorAll('h1, h2, h3, p, li')].map(n => ({
        text: n.textContent.trim(),
        el: n
      }));

      const scored = nodes
        .map(({ text, el }) => {
          const lower = text.toLowerCase();
          let score = 0;
          if (lower.includes(val)) score += 3;
          const terms = val.split(/\s+/).filter(Boolean);
          for (const term of terms) {
            if (lower.includes(term)) score += 1;
          }
          return { text, score, el };
        })
        .filter(x => x.score > 0)
        .sort((a, b) => b.score - a.score)
        .slice(0, 8);

      if (!scored.length) {
        resultsBox.style.display = 'none';
        return;
      }

      resultsBox.style.display = 'block';
      scored.forEach(item => {
        const link = document.createElement('a');
        const text = item.text.length > 80 ? item.text.slice(0, 80) + '...' : item.text;
        link.href = '#';
        link.textContent = text;
        link.addEventListener('click', (e) => {
          e.preventDefault();
          item.el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          resultsBox.style.display = 'none';
        });
        resultsBox.appendChild(link);
      });
    }

    chapterSelect.addEventListener('change', render);
    searchInput.addEventListener('input', () => smartSearch(searchInput.value));
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-wrap')) {
        resultsBox.style.display = 'none';
      }
    });
    document.getElementById('recommendBtn').addEventListener('click', recommend);

    Promise.all([loadKnowledge(), render()]);
  </script>
</body>
</html>
