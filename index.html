<body>
<header>
  <div class="topbar">
    <div class="brand"><span>VE</span>Crop</div>
    <button class="mobile-toc" id="tocBtn">☰ Mục lục</button>
    <div class="search"><input id="search" placeholder="Tìm trong toàn bộ tài liệu…"></div>
    <button id="themeBtn" title="Đổi giao diện">🌙</button>
    <button onclick="window.print()" title="In hoặc lưu PDF">🖨 In</button>
  </div>
</header>
<div class="layout">
  <aside id="sidebar"><div class="toc-title">Mục lục</div><nav class="toc" id="toc"></nav></aside>
  <main><article id="content"><h1>VECrop</h1><p>Đang tải tài liệu…</p></article><div class="status" id="status"></div></main>
</div>
<script>
const contentEl=document.getElementById('content');
const tocEl=document.getElementById('toc');
const statusEl=document.getElementById('status');
const searchEl=document.getElementById('search');
const sidebar=document.getElementById('sidebar');
let rawMarkdown='';

function slugify(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}
function escapeRegExp(s){
  return s.replace(/[.*+?^()|[\]\\]/g,'\\$&');
}
function buildToc(){
  tocEl.innerHTML='';
  const hs=[...contentEl.querySelectorAll('h1,h2,h3')];
  hs.forEach((h,i)=>{
    if(!h.id)h.id=slugify(h.textContent)||('sec-'+i);
    const a=document.createElement('a');
    a.href='#'+h.id;a.textContent=h.textContent;
    a.style.paddingLeft=h.tagName==='H1'?'8px':h.tagName==='H2'?'18px':'30px';
    tocEl.appendChild(a);
  });
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        [...tocEl.querySelectorAll('a')].forEach(a=>a.classList.remove('active'));
        const a=tocEl.querySelector('a[href="#'+e.target.id+'"]');if(a)a.classList.add('active');
      }
    });
  },{rootMargin:'-20% 0px -70% 0px'});
  hs.forEach(h=>obs.observe(h));
}
function render(md){
  contentEl.innerHTML=marked.parse(md);
  buildToc();
  if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([contentEl]);
}
async function loadDoc(){
  try{
    const r=await fetch('docs/VECrop-full.md',{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    rawMarkdown=await r.text();render(rawMarkdown);
    statusEl.textContent='VECrop — giáo trình làm việc từ Chương 1 đến Chương 12';
  }catch(err){
    contentEl.innerHTML='<h1>Không tải được tài liệu</h1><p>Hãy mở trang bằng GitHub Pages hoặc một web server. Lỗi: '+err.message+'</p>';
  }
}
searchEl.addEventListener('input',()=>{
  render(rawMarkdown);
  const q=searchEl.value.trim();if(!q)return;
  const re=new RegExp(escapeRegExp(q),'gi');
  const walker=document.createTreeWalker(contentEl,NodeFilter.SHOW_TEXT);
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(n=>{
    if(['SCRIPT','STYLE','CODE','PRE'].includes(n.parentElement?.tagName))return;
    if(re.test(n.nodeValue)){
      re.lastIndex=0;
      const span=document.createElement('span');
      span.innerHTML=n.nodeValue.replace(re,m=>'<mark>'+m+'</mark>');
      n.parentNode.replaceChild(span,n);
    }
    re.lastIndex=0;
  });
  const first=contentEl.querySelector('mark');if(first)first.scrollIntoView({behavior:'smooth',block:'center'});
});
document.getElementById('themeBtn').onclick=()=>{
  const dark=document.documentElement.dataset.theme==='dark';
  document.documentElement.dataset.theme=dark?'':'dark';
  document.getElementById('themeBtn').textContent=dark?'🌙':'☀️';
  localStorage.setItem('vecrop-theme',dark?'light':'dark');
};
if(localStorage.getItem('vecrop-theme')==='dark'){
  document.documentElement.dataset.theme='dark';
  document.getElementById('themeBtn').textContent='☀️';
}
document.getElementById('tocBtn').onclick=()=>sidebar.classList.toggle('open');
loadDoc();
</script>
</body>

  render(rawMarkdown);
  const q=searchEl.value.trim();if(!q)return;
  const re=new RegExp(escapeRegExp(q),'gi');
  const walker=document.createTreeWalker(contentEl,NodeFilter.SHOW_TEXT);
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(n=>{
    if(['SCRIPT','STYLE','CODE','PRE'].includes(n.parentElement?.tagName))return;
    if(re.test(n.nodeValue)){
      re.lastIndex=0;
      const span=document.createElement('span');
      span.innerHTML=n.nodeValue.replace(re,m=>'<mark>'+m+'</mark>');
      n.parentNode.replaceChild(span,n);
    }
    re.lastIndex=0;
  });
  const first=contentEl.querySelector('mark');if(first)first.scrollIntoView({behavior:'smooth',block:'center'});
});
document.getElementById('themeBtn').onclick=()=>{
  const dark=document.documentElement.dataset.theme==='dark';
  document.documentElement.dataset.theme=dark?'':'dark';
  document.getElementById('themeBtn').textContent=dark?'🌙':'☀️';
  localStorage.setItem('vecrop-theme',dark?'light':'dark');
};
if(localStorage.getItem('vecrop-theme')==='dark'){
  document.documentElement.dataset.theme='dark';
  document.getElementById('themeBtn').textContent='☀️';
}
document.getElementById('tocBtn').onclick=()=>sidebar.classList.toggle('open');
loadDoc();
