<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VECrop — HTML động đến 4.15</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
window.MathJax={tex:{inlineMath:[["\\(","\\)"]],displayMath:[["\\[","\\]"]],processEscapes:true},svg:{fontCache:"global"},startup:{typeset:false}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
:root{--bg:#f5f7fa;--panel:#fff;--text:#17202a;--muted:#667085;--line:#e4e7ec;--accent:#176b44;--soft:#edf7f1}
[data-theme="dark"]{--bg:#0d1117;--panel:#161b22;--text:#e6edf3;--muted:#9da7b3;--line:#30363d;--accent:#55c98a;--soft:#10291d}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.68 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.top{max-width:1500px;margin:auto;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;font-size:20px;white-space:nowrap}.brand span{color:var(--accent)}
select,input,button{font:inherit}select,input{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px 10px}select{min-width:190px}#search{flex:1;min-width:220px}
button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px 11px;cursor:pointer}
.status{max-width:1500px;margin:auto;padding:0 16px 8px;font-size:13px;color:var(--muted)}
.layout{max-width:1500px;margin:auto;display:grid;grid-template-columns:320px minmax(0,1fr);gap:22px;padding:18px}
aside{position:sticky;top:104px;height:calc(100vh - 124px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px}
#toc a{display:block;color:var(--muted);text-decoration:none;padding:5px 7px;border-radius:7px;font-size:14px}#toc a:hover{background:var(--soft);color:var(--accent)}
main{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:34px 42px;min-width:0}article{max-width:1000px;margin:auto}
h1,h2,h3{line-height:1.25;scroll-margin-top:120px}h1{font-size:2.15rem}h2{margin-top:2.1em;border-bottom:1px solid var(--line);padding-bottom:.35em}h3{margin-top:1.5em}
code{background:var(--soft);padding:.14em .34em;border-radius:5px}blockquote{border-left:4px solid var(--accent);background:var(--soft);margin:1em 0;padding:.7em 1em}
.flow-chain{padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--soft);line-height:2;overflow-x:auto}
table{border-collapse:collapse;width:100%;display:block;overflow:auto;margin:1em 0}th,td{border:1px solid var(--line);padding:8px 10px;text-align:left}th{background:var(--soft)}
mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;padding:.3em 0}.mobile{display:none}
@media(max-width:900px){.layout{display:block;padding:10px}aside{display:none}aside.open{display:block;position:fixed;z-index:50;left:10px;right:10px;top:112px;height:72vh}main{padding:20px 14px}.mobile{display:inline-block}}
</style>
</head>
<body>
<header><div class="top"><div class="brand"><span>VE</span>Crop — động đến 4.15</div><button id="tocBtn" class="mobile">☰</button><select id="chapter"><option value="all">Tất cả Chương 1 → 4.15</option><option value="1">Chương 1</option><option value="2">Chương 2</option><option value="3">Chương 3</option><option value="4">Chương 4 → 4.15</option></select><input id="search" placeholder="Tìm trong nội dung đang mở…"><button id="theme">🌙</button><button onclick="window.print()">🖨</button></div><div id="status" class="status">Đang tải…</div></header>
<div class="layout"><aside id="sidebar"><strong>Mục lục</strong><nav id="toc"></nav></aside><main><article id="content"><p>Đang tải giáo trình…</p></article></main></div>
<script>
const FILES={"1":"docs/01-chapter-1.md","2":"docs/02-chapter-2.md","3":"docs/03-chapter-3.md","4":"docs/04-chapter-4.md"};
const cache={};const content=document.getElementById("content"),toc=document.getElementById("toc"),chapter=document.getElementById("chapter"),search=document.getElementById("search"),status=document.getElementById("status"),sidebar=document.getElementById("sidebar");
function protectMath(md){const blocks=[];md=md.replace(/\$\$([\s\S]*?)\$\$/g,function(_,x){const i=blocks.length;blocks.push("\\\\["+x.trim()+"\\\\]");return "@@MATHBLOCK"+i+"@@";});return {md:md,blocks:blocks};}
function restoreMath(html,blocks){return html.replace(/@@MATHBLOCK(\d+)@@/g,function(_,i){return "<div class=\"math-block\">"+blocks[Number(i)]+"</div>";});}
async function getDoc(id){if(cache[id])return cache[id];const r=await fetch(FILES[id]+"?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error(FILES[id]+" HTTP "+r.status);cache[id]=await r.text();return cache[id];}
function slug(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");}
function buildToc(){toc.innerHTML="";[...content.querySelectorAll("h1,h2,h3")].forEach(function(h,i){h.id=slug(h.textContent)||("s"+i);const a=document.createElement("a");a.href="#"+h.id;a.textContent=h.textContent;a.style.paddingLeft=h.tagName==="H1"?"6px":h.tagName==="H2"?"16px":"28px";toc.appendChild(a);});}
async function typeset(){if(window.MathJax&&MathJax.typesetPromise){MathJax.typesetClear&&MathJax.typesetClear([content]);await MathJax.typesetPromise([content]);}}
async function render(){status.textContent="Đang tải…";content.innerHTML="<p>Đang tải giáo trình…</p>";try{const ids=chapter.value==="all"?["1","2","3","4"]:[chapter.value];const docs=await Promise.all(ids.map(getDoc));const htmls=docs.map(function(md){const p=protectMath(md);return restoreMath(marked.parse(p.md),p.blocks);});content.innerHTML=htmls.join("<hr>");buildToc();await typeset();search.value="";status.textContent=chapter.value==="all"?"Chương 1 → 4.15 • tải trực tiếp từ Markdown":"Chương "+chapter.value+" • tải trực tiếp từ Markdown";window.scrollTo(0,0);}catch(e){content.innerHTML="<h1>Lỗi tải nội dung</h1><p>"+e.message+"</p>";status.textContent="Lỗi";}}
chapter.addEventListener("change",render);
search.addEventListener("input",function(){const q=search.value.trim().toLowerCase();if(!q)return;const hit=[...content.querySelectorAll("h1,h2,h3,p,li,td,th")].find(function(x){return x.textContent.toLowerCase().includes(q);});if(hit)hit.scrollIntoView({behavior:"smooth",block:"center"});});
document.getElementById("theme").onclick=function(){const dark=document.documentElement.dataset.theme==="dark";document.documentElement.dataset.theme=dark?"":"dark";this.textContent=dark?"🌙":"☀️";localStorage.setItem("vecrop-theme",dark?"light":"dark");};
if(localStorage.getItem("vecrop-theme")==="dark"){document.documentElement.dataset.theme="dark";document.getElementById("theme").textContent="☀️";}
document.getElementById("tocBtn").onclick=function(){sidebar.classList.toggle("open");};
render();
</script>
</body></html>
