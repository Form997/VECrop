<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VECrop — Dynamic Intelligence UI</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>window.MathJax={tex:{inlineMath:[["\\(","\\)"]],displayMath:[["\\[","\\]"]],processEscapes:true},svg:{fontCache:"global"},startup:{typeset:false}};</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
:root{--bg:#eef3f1;--panel:#fff;--panel2:#f7faf8;--text:#12231b;--muted:#66756d;--line:#dce7e1;--accent:#0f7a4f;--accent2:#16a36a;--soft:#e7f6ee;--warn:#fff4d6;--danger:#fff0f0;--shadow:0 10px 30px rgba(18,35,27,.08)}
[data-theme="dark"]{--bg:#0c1210;--panel:#131b17;--panel2:#17211c;--text:#e8f1ec;--muted:#9bad9f;--line:#29362f;--accent:#5fd69a;--accent2:#7fe3ad;--soft:#153526;--warn:#3b3217;--danger:#351c1c;--shadow:none}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:15.5px/1.68 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}[data-theme="dark"] header{background:rgba(19,27,23,.92)}
.top{max-width:1680px;margin:auto;padding:10px 16px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}.brand{font-weight:850;font-size:20px;white-space:nowrap}.brand span{color:var(--accent)}
select,input,textarea,button{font:inherit}select,input,textarea{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 10px}button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer}button:hover{border-color:var(--accent);color:var(--accent)}
#search{flex:1;min-width:220px}.status{max-width:1680px;margin:auto;padding:0 16px 8px;color:var(--muted);font-size:12.5px}
.stats{max-width:1680px;margin:14px auto 0;padding:0 18px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px 14px;box-shadow:var(--shadow)}.stat b{display:block;font-size:21px;color:var(--accent)}.stat span{font-size:12px;color:var(--muted)}
.layout{max-width:1680px;margin:auto;display:grid;grid-template-columns:285px minmax(0,1fr) 330px;gap:16px;padding:16px 18px 26px}
aside,.smart,main{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}aside{position:sticky;top:102px;height:calc(100vh - 122px);overflow:auto;padding:13px}.smart{position:sticky;top:102px;height:calc(100vh - 122px);overflow:auto;padding:14px}main{padding:30px 38px;min-width:0}article{max-width:980px;margin:auto}
#toc a{display:block;color:var(--muted);text-decoration:none;padding:5px 7px;border-radius:7px;font-size:13px}#toc a:hover{background:var(--soft);color:var(--accent)}
h1,h2,h3{line-height:1.25;scroll-margin-top:120px}h1{font-size:2.05rem}h2{margin-top:2em;border-bottom:1px solid var(--line);padding-bottom:.35em}h3{margin-top:1.4em}
code{background:var(--soft);padding:.14em .34em;border-radius:5px}blockquote{border-left:4px solid var(--accent);background:var(--soft);margin:1em 0;padding:.7em 1em}.flow-chain{padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--soft);overflow-x:auto}
table{border-collapse:collapse;width:100%;display:block;overflow:auto;margin:1em 0}th,td{border:1px solid var(--line);padding:8px 10px;text-align:left}th{background:var(--soft)}mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;padding:.3em 0}
.smart h3{margin:.2em 0 .7em}.smart label{display:block;font-size:12px;color:var(--muted);margin-top:10px}.smart select,.smart textarea{width:100%}.smart textarea{min-height:76px;resize:vertical}.smart .go{width:100%;margin-top:10px;background:var(--accent);color:white;border-color:var(--accent)}
.badge,.chip{display:inline-block;border-radius:999px;padding:4px 8px;margin:3px 3px 3px 0;font-size:11.5px}.badge{background:var(--soft);color:var(--accent)}.chip{background:var(--panel2);border:1px solid var(--line)}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px;margin-top:10px}.card strong{display:block;margin-bottom:4px}.warning{background:var(--warn)}.mini{font-size:12px;color:var(--muted)}
.search-results{position:absolute;top:52px;left:0;right:0;max-height:320px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:none;z-index:80}.search-wrap{position:relative;flex:1;min-width:240px}.result{padding:9px 11px;border-bottom:1px solid var(--line);cursor:pointer}.result:hover{background:var(--soft)}.result b{display:block}.result small{color:var(--muted)}
.mobile{display:none}@media(max-width:1180px){.layout{grid-template-columns:250px minmax(0,1fr)}.smart{position:relative;top:auto;height:auto;grid-column:1/-1}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.layout{display:block;padding:10px}.stats{grid-template-columns:1fr 1fr;padding:0 10px}aside{display:none}aside.open{display:block;position:fixed;z-index:70;left:10px;right:10px;top:112px;height:72vh}main{padding:20px 14px;margin-bottom:10px}.smart{margin-top:10px}.mobile{display:inline-block}.brand{font-size:18px}}
</style></head><body>
<header><div class="top"><div class="brand"><span>VE</span>Crop Intelligence</div><button id="tocBtn" class="mobile">☰</button><select id="chapter"><option value="all">Tất cả Chương 1 → 4.20</option><option value="1">Chương 1</option><option value="2">Chương 2</option><option value="3">Chương 3</option><option value="4">Chương 4 → 4.20</option></select><div class="search-wrap"><input id="search" placeholder="Tìm thông minh trong giáo trình…"><div id="searchResults" class="search-results"></div></div><button id="theme">🌙</button><button onclick="window.print()">🖨</button></div><div id="status" class="status">Đang nạp giáo trình và knowledge engine…</div></header>
<section class="stats"><div class="stat"><b>4</b><span>Chương đang hoạt động</span></div><div class="stat"><b id="cropCount">—</b><span>Hồ sơ cây từ Python</span></div><div class="stat"><b id="moduleCount">—</b><span>Core modules</span></div><div class="stat"><b>4.20</b><span>Mốc hiện tại</span></div></section>
<div class="layout"><aside id="sidebar"><strong>Mục lục động</strong><nav id="toc"></nav></aside><main><article id="content"><p>Đang tải giáo trình…</p></article></main><section class="smart"><h3>Trợ lý VECrop</h3><div class="mini">Nguồn logic: <code>python/vecrop_engine.py</code> → JSON cho UI.</div><label>Cây trồng</label><select id="cropSelect"><option>Đang tải…</option></select><label>Mục tiêu / vấn đề</label><textarea id="objective" placeholder="Ví dụ: hạn, năng suất, dinh dưỡng, chất lượng, thủy canh…"></textarea><button class="go" id="analyze">Phân tích cấu hình</button><div id="smartOut"></div></section></div>
<script>
const FILES={"1":"docs/01-chapter-1.md","2":"docs/02-chapter-2.md","3":"docs/03-chapter-3.md","4":"docs/04-chapter-4.md"};
let KNOWLEDGE=null;const cache={};const content=document.getElementById("content"),toc=document.getElementById("toc"),chapter=document.getElementById("chapter"),search=document.getElementById("search"),results=document.getElementById("searchResults"),status=document.getElementById("status"),sidebar=document.getElementById("sidebar");
function protectMath(md){const blocks=[];md=md.replace(/\$\$([\s\S]*?)\$\$/g,function(_,x){const i=blocks.length;blocks.push("\\\\["+x.trim()+"\\\\]");return "@@MATHBLOCK"+i+"@@";});return {md,blocks};}
function restoreMath(html,blocks){return html.replace(/@@MATHBLOCK(\d+)@@/g,function(_,i){return "<div class=\"math-block\">"+blocks[Number(i)]+"</div>";});}
async function getDoc(id){if(cache[id])return cache[id];const r=await fetch(FILES[id]+"?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error(FILES[id]+" HTTP "+r.status);cache[id]=await r.text();return cache[id];}
function slug(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");}
function buildToc(){toc.innerHTML="";[...content.querySelectorAll("h1,h2,h3")].forEach(function(h,i){h.id=slug(h.textContent)||("s"+i);const a=document.createElement("a");a.href="#"+h.id;a.textContent=h.textContent;a.style.paddingLeft=h.tagName==="H1"?"6px":h.tagName==="H2"?"16px":"28px";toc.appendChild(a);});}
async function typeset(){if(window.MathJax&&MathJax.typesetPromise){MathJax.typesetClear&&MathJax.typesetClear([content]);await MathJax.typesetPromise([content]);}}
async function render(){status.textContent="Đang tải nội dung…";content.innerHTML="<p>Đang tải giáo trình…</p>";try{const ids=chapter.value==="all"?["1","2","3","4"]:[chapter.value];const docs=await Promise.all(ids.map(getDoc));content.innerHTML=docs.map(function(md){const p=protectMath(md);return restoreMath(marked.parse(p.md),p.blocks);}).join("<hr>");buildToc();await typeset();status.textContent="VECrop 1 → 4.20 • Markdown động • Python knowledge engine: "+(KNOWLEDGE?"đã nạp":"đang nạp");window.scrollTo(0,0);}catch(e){content.innerHTML="<h1>Lỗi tải nội dung</h1><p>"+e.message+"</p>";status.textContent="Lỗi";}}
async function loadKnowledge(){try{const r=await fetch("docs/data/vecrop_intelligence.json?v="+Date.now(),{cache:"no-store"});KNOWLEDGE=await r.json();document.getElementById("cropCount").textContent=Object.keys(KNOWLEDGE.crops).length;document.getElementById("moduleCount").textContent=KNOWLEDGE.core_modules.length;const s=document.getElementById("cropSelect");s.innerHTML=Object.values(KNOWLEDGE.crops).sort((a,b)=>a.name_vi.localeCompare(b.name_vi,"vi")).map(c=>`<option value="${c.crop_id}">${c.name_vi} — ${c.species}</option>`).join("");status.textContent="VECrop 1 → 4.20 • Markdown động • Python knowledge engine đã nạp";}catch(e){document.getElementById("smartOut").innerHTML="<div class=\"card warning\"><strong>Không nạp được knowledge JSON</strong><span class=\"mini\">"+e.message+"</span></div>";}}
function recommend(){if(!KNOWLEDGE)return;const id=document.getElementById("cropSelect").value,c=KNOWLEDGE.crops[id],q=document.getElementById("objective").value.toLowerCase();let extra=[];if(/nước|water|hạn|drought/.test(q))extra.push("water_balance","root_distribution","hydraulic_risk");if(/dinh dưỡng|nutrient|đạm|nitrogen/.test(q))extra.push("nutrient_balance","source_sink");if(/chất lượng|quality|thương phẩm|market/.test(q))extra.push("quality","marketability");if(/nhà kính|greenhouse|thủy canh|hydroponic/.test(q))extra.push("controlled_environment","fertigation","rootzone_ec_ph_do");const mods=[...new Set([...(c.all_modules||[]),...extra])];document.getElementById("smartOut").innerHTML=`<div class="card"><strong>${c.name_vi}</strong><div class="mini"><i>${c.species}</i> • ${c.group}</div><span class="badge">${c.photosynthesis}</span><span class="badge">Thu hoạch: ${c.harvest_organ}</span></div><div class="card"><strong>Module đề xuất</strong>${mods.map(x=>`<span class="chip">${x}</span>`).join("")}</div><div class="card warning"><strong>Kiểm soát khoa học</strong><div class="mini">Framework hiện chưa đồng nghĩa đã được hiệu chuẩn/kiểm định cho giống cụ thể. Mọi tham số sinh học phải có provenance; tránh double counting.</div></div>`;}
function smartSearch(q){q=q.trim().toLowerCase();results.innerHTML="";if(q.length<2){results.style.display="none";return;}const nodes=[...content.querySelectorAll("h1,h2,h3,p,li")];const scored=nodes.map((el,i)=>{const t=el.textContent.trim(),x=t.toLowerCase();let s=0;if(x.startsWith(q))s+=4;if(x.includes(q))s+=2;if(/^h[1-3]$/i.test(el.tagName))s+=2;return {el,t,s,i};}).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,8);results.innerHTML=scored.length?scored.map((x,i)=>`<div class="result" data-i="${i}"><b>${x.t.slice(0,95)}</b><small>${x.el.tagName}</small></div>`).join(""):"<div class=\"result\">Không tìm thấy.</div>";results.style.display="block";[...results.querySelectorAll("[data-i]")].forEach((r,i)=>r.onclick=()=>{scored[i].el.scrollIntoView({behavior:"smooth",block:"center"});results.style.display="none";});}
chapter.addEventListener("change",render);search.addEventListener("input",()=>smartSearch(search.value));document.addEventListener("click",e=>{if(!e.target.closest(".search-wrap"))results.style.display="none";});document.getElementById("analyze").onclick=recommend;
document.getElementById("theme").onclick=function(){const dark=document.documentElement.dataset.theme==="dark";document.documentElement.dataset.theme=dark?"":"dark";this.textContent=dark?"🌙":"☀️";localStorage.setItem("vecrop-theme",dark?"light":"dark");};if(localStorage.getItem("vecrop-theme")==="dark"){document.documentElement.dataset.theme="dark";document.getElementById("theme").textContent="☀️";}
document.getElementById("tocBtn").onclick=()=>sidebar.classList.toggle("open");Promise.all([loadKnowledge(),render()]);
</script></body></html>
